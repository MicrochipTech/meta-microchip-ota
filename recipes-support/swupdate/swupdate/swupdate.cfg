globals :
{
	verbose = true;
	loglevel = 5;
	syslog = true;
	/* public-key-file = "test.pem";*/
	namespace-vars = "uboot";
};

logcolors : {
	error = "red:blink";
	trace = "green:normal";
	debug = "magenta:normal";
	warning = "yellow:underline";
};

download :
{
	retries = 3;
	timeout = 30;
};

versions : (
	{
		name = "Software";
		version = "default_sw_rev";
	},
	{
		name = "Application";
		version = "default_app_rev";
	}
);

identify : (
	{ name = "board"; value = "default_board_name"; },
	{ name = "serial"; value = "default_serial"; },
	{ name = "HW Version"; value = "1.0.0"; },
	{ name = "SW Version"; value = "1.0.0"; },
	{ name = "App Version"; value = "1.0.0"; },
	{ name = "App Data Version"; value = "1.0"; },
);

suricatta :
{

	tenant		= "default";
	id		= "default_id";
	confirm		= 0;
	url		= "http://hostname.com";
	polldelay	= 10;
	nocheckcert	= false;
	retry		= 4;
	retrywait	= 10;
	loglevel	= 10;
	userid		= 0;
	groupid		= 0;
	max_artifacts	= 1;

	/* sslkey	= "pkcs11:token=MCHP;object=device;type=private"; */
	/* sslcert	= "/etc/swupdate/default.cert.pem"; */
};

delta :
{

	/* sslkey	= "pkcs11:token=MCHP;object=device;type=private"; */
	/* sslcert	= "/etc/swupdate/default.cert.pem"; */

};

webserver :
{
	document_root = "/www";
	userid		= 0;
	groupid		= 0;
};
